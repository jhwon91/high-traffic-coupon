services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: coupon
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: coupon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon -d coupon"]
      interval: 5s
      timeout: 3s
      retries: 20
  coupon-service:
    image: coupon-service:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coupon
      SPRING_DATASOURCE_USERNAME: coupon
      SPRING_DATASOURCE_PASSWORD: coupon
    ports:
      - "8080:8080"

volumes:
  postgres-data: